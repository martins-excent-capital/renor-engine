name: verify-npx
# One-off: the published package from an empty npm cache, empty home and empty working folder.
on:
  push:
    branches: ['ci/verify-npx-**']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, node: '22' }
          - { os: macos-latest, node: '24' }
          - { os: ubuntu-latest, node: '24' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: uname -sm && node -v
      - run: node scripts/verify-npx.mjs
